<!doctype html>
<!--
  Word Pop (captions), mountable sub-composition

  concept: one word at a time over the picture, each popping in as it is said. Heavy type with a
  thick black outline and a solid drop shadow; key words in a colour of their own.

  mount contract: loaded by a host through data-composition-src; only <template> is cloned.
  #root fills the host clip (inset:0) and takes its size, so it suits any aspect. See demo.html.

  variables:
    words (string)        a JSON array of { "text", "start", "end", "key" }: each word and when it
                          is said, in seconds of this composition; "key": true marks a key word
    color (color)         the words' colour
    key_color (color)     the key words' colour
    font (font)           the family, drawn in its heaviest weight
    letter_case (enum)    upper, lower, or written (as the words are spelled)
    size (number)         the letters' height, as a share of the frame's shorter side
    position (enum)       top, center or bottom
    outline (boolean)     the black outline around the letters
    shadow (boolean)      the solid black shadow down and to the right
-->
<html
  lang="en"
  data-composition-id="caption-word-pop"
  data-composition-duration="8"
  data-composition-variables='[
    { "id": "words", "type": "string", "role": "content", "label": "Words", "description": "Each word and when it is said: a JSON array of {text, start, end} in seconds of this composition; key: true marks a key word.", "default": "[{\"text\":\"Every\",\"start\":0,\"end\":0.3},{\"text\":\"great\",\"start\":0.3,\"end\":0.55,\"key\":true},{\"text\":\"video\",\"start\":0.55,\"end\":0.85},{\"text\":\"starts\",\"start\":0.85,\"end\":1.1},{\"text\":\"with\",\"start\":1.1,\"end\":1.25},{\"text\":\"a\",\"start\":1.25,\"end\":1.35},{\"text\":\"single\",\"start\":1.35,\"end\":1.65},{\"text\":\"frame.\",\"start\":1.65,\"end\":2,\"key\":true}]" },
    { "id": "color", "type": "color", "role": "style", "label": "Text colour", "default": "#ffffff" },
    { "id": "key_color", "type": "color", "role": "style", "label": "Key word colour", "default": "#ff2d2d" },
    { "id": "font", "type": "font", "role": "style", "label": "Font", "default": "Montserrat" },
    { "id": "letter_case", "type": "enum", "role": "style", "label": "Letters", "default": "upper", "options": [ { "value": "upper", "label": "Capitals" }, { "value": "lower", "label": "Small letters" }, { "value": "written", "label": "As written" } ] },
    { "id": "size", "type": "number", "role": "style", "label": "Size", "description": "Letter height as a share of the shorter side of the frame.", "default": 0.14, "min": 0.04, "max": 0.3, "step": 0.01 },
    { "id": "position", "type": "enum", "role": "layout", "label": "Position", "default": "center", "options": [ { "value": "top", "label": "Top" }, { "value": "center", "label": "Centre" }, { "value": "bottom", "label": "Bottom" } ] },
    { "id": "outline", "type": "boolean", "role": "style", "label": "Outline", "default": true },
    { "id": "shadow", "type": "boolean", "role": "style", "label": "Shadow", "default": true }
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Word Pop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          pointer-events: none;
        }
        .wp-word {
          position: absolute;
          left: 50%;
          font-weight: 900;
          line-height: 1;
          white-space: nowrap;
          opacity: 0;
          visibility: hidden;
          will-change: transform, opacity;
        }
      </style>

      <div
        id="root"
        data-composition-id="caption-word-pop"
        data-duration="8"
        data-timeline-locked
      ></div>

      <script>
        (function () {
          "use strict";

          var html = document.documentElement;
          var root = document.getElementById("root");

          var DEFAULTS = {};
          try {
            JSON.parse(html.getAttribute("data-composition-variables") || "[]").forEach(
              function (variable) {
                DEFAULTS[variable.id] = variable.default;
              },
            );
          } catch (error) {
            /* malformed declaration falls back to the inline defaults below */
          }
          var scopedVariables = {};
          try {
            if (window.__hyperframes && typeof window.__hyperframes.getVariables === "function") {
              scopedVariables = window.__hyperframes.getVariables() || {};
            }
          } catch (error) {
            /* no scoped variables API in this context */
          }
          var vars = Object.assign({}, DEFAULTS, window.__hfVariables || {}, scopedVariables);

          // Hardcoded: the compositor rewrites the wrapper's attributes on mount.
          var compositionId = "caption-word-pop";
          var W = root.clientWidth || 1920;
          var H = root.clientHeight || 1080;

          var hex = function (value, fallback) {
            return /^#[0-9a-f]{3,8}$/i.test(String(value)) ? String(value) : fallback;
          };
          var on = function (value) {
            return value !== false && value !== "false";
          };
          var color = hex(vars.color, "#ffffff");
          var keyColor = hex(vars.key_color, "#ff2d2d");
          var family = /^[\w .'-]{1,60}$/.test(String(vars.font))
            ? String(vars.font)
            : "Montserrat";
          var share = Math.min(0.3, Math.max(0.04, Number(vars.size) || 0.14));
          var base = Math.round(Math.min(W, H) * share);
          var top = { top: 0.18, bottom: 0.82 }[vars.position] || 0.5;
          var transform = { lower: "lowercase", written: "none" }[vars.letter_case] || "uppercase";
          var cased = function (text) {
            return transform === "uppercase"
              ? text.toUpperCase()
              : transform === "lowercase"
                ? text.toLowerCase()
                : text;
          };

          // One word at a time: each with its start and end in seconds, and `key: true` on a key word.
          var words = [];
          try {
            var parsed = typeof vars.words === "string" ? JSON.parse(vars.words) : vars.words;
            if (Array.isArray(parsed)) {
              words = parsed.filter(function (w) {
                return w && typeof w.text === "string" && isFinite(w.start) && isFinite(w.end);
              });
            }
          } catch (error) {
            /* words that aren't JSON show nothing */
          }

          var fitCtx = document.createElement("canvas").getContext("2d");
          function fitFontSize(text, maxWidth) {
            var size = base;
            var min = Math.floor(base * 0.45);
            while (size > min) {
              fitCtx.font = "900 " + size + 'px "' + family + '"';
              if (fitCtx.measureText(text).width <= maxWidth) return size;
              size -= 2;
            }
            return min;
          }

          // A thick black outline with a solid shadow down and to the right, as one text-shadow: black copies
          // of the letters all around them, and the same ring again where the shadow falls.
          var OUTLINE = 0.1;
          var SHADOW = 0.08;
          function ring(radius, copies, shift) {
            var out = [];
            for (var i = 0; i < copies; i++) {
              var angle = (2 * Math.PI * i) / copies;
              var x = (Math.cos(angle) * radius + shift).toFixed(3);
              var y = (Math.sin(angle) * radius + shift).toFixed(3);
              out.push(x + "em " + y + "em 0 #000");
            }
            return out;
          }
          var outline = on(vars.outline);
          var shadow = on(vars.shadow);
          var textShadow = []
            .concat(outline ? ring(OUTLINE, 24, 0).concat(ring(OUTLINE / 2, 12, 0)) : [])
            .concat(
              outline && shadow
                ? ring(OUTLINE, 24, SHADOW).concat(ring(OUTLINE / 2, 12, SHADOW))
                : [],
            )
            .concat(shadow ? [SHADOW + "em " + SHADOW + "em 0 #000"] : [])
            .join(", ");

          // When each word shows. Speech-to-text gives some words no time of their own (they start when the
          // next one does) and stretches a word over the silence before it: the first takes the later half of
          // the time before it, the second shows only for its last half second.
          var MIN = 0.1;
          var starts = words.map(function (w) {
            return w.end - w.start > 1 ? w.end - 0.5 : w.start;
          });
          words.forEach(function (_, i) {
            if (i + 1 < words.length && starts[i + 1] - starts[i] < MIN) {
              starts[i] = ((i > 0 ? starts[i - 1] : 0) + starts[i]) / 2;
            }
          });

          var tl = gsap.timeline({ paused: true });

          words.forEach(function (w, i) {
            // Up until the next word, or half a second into a pause.
            var start = starts[i];
            var next = i + 1 < words.length ? starts[i + 1] : Infinity;
            var end = Math.max(start + MIN, Math.min(next, w.end + 0.5));

            var el = document.createElement("div");
            el.className = "wp-word";
            el.textContent = cased(w.text.replace(/[.,!?;:]+$/, ""));
            el.style.top = top * 100 + "%";
            el.style.color = w.key ? keyColor : color;
            el.style.fontFamily = '"' + family + '", sans-serif';
            el.style.fontSize = fitFontSize(el.textContent, W * 0.84) + "px";
            if (textShadow) el.style.textShadow = textShadow;
            root.appendChild(el);

            tl.set(el, { visibility: "visible", opacity: 1 }, start);
            tl.fromTo(
              el,
              { scale: 0.82, xPercent: -50, yPercent: -50 },
              { scale: 1, xPercent: -50, yPercent: -50, duration: 0.1, ease: "back.out(2.2)" },
              start,
            );
            tl.set(el, { opacity: 0, visibility: "hidden" }, end);
          });

          tl.seek(0);
          window.__timelines = window.__timelines || {};
          window.__timelines[compositionId] = tl;
        })();
      </script>
    </template>
  </body>
</html>
