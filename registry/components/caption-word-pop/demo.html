<!doctype html>
<!--
  Word Pop, standalone demo: a line of narration shown one word at a time. It mounts
  caption-word-pop.html full-frame over a dark backdrop, with the words passed as a variable.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Word Pop, Demo</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: radial-gradient(circle at 50% 40%, #2a2f3a, #0a0a0a 70%);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="caption-word-pop-demo"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="8"
    >
      <div
        class="clip"
        id="caption-word-pop"
        data-composition-id="caption-word-pop"
        data-composition-src="./caption-word-pop.html"
        data-variable-values='{"words":"[{\"text\":\"Every\",\"start\":0.0,\"end\":0.3},{\"text\":\"great\",\"start\":0.3,\"end\":0.55,\"key\":true},{\"text\":\"video\",\"start\":0.55,\"end\":0.85},{\"text\":\"starts\",\"start\":0.85,\"end\":1.1},{\"text\":\"with\",\"start\":1.1,\"end\":1.25},{\"text\":\"a\",\"start\":1.25,\"end\":1.35},{\"text\":\"single\",\"start\":1.35,\"end\":1.65},{\"text\":\"frame.\",\"start\":1.65,\"end\":2.0,\"key\":true},{\"text\":\"HyperFrames\",\"start\":2.1,\"end\":2.65},{\"text\":\"lets\",\"start\":2.65,\"end\":2.85},{\"text\":\"you\",\"start\":2.85,\"end\":2.95},{\"text\":\"write\",\"start\":2.95,\"end\":3.15},{\"text\":\"HTML\",\"start\":3.15,\"end\":3.55,\"key\":true},{\"text\":\"and\",\"start\":3.55,\"end\":3.65},{\"text\":\"render\",\"start\":3.65,\"end\":3.95},{\"text\":\"professional\",\"start\":3.95,\"end\":4.45},{\"text\":\"video.\",\"start\":4.45,\"end\":4.8},{\"text\":\"No\",\"start\":4.9,\"end\":5.05},{\"text\":\"timeline.\",\"start\":5.05,\"end\":5.45},{\"text\":\"No\",\"start\":5.5,\"end\":5.65},{\"text\":\"drag\",\"start\":5.65,\"end\":5.85},{\"text\":\"and\",\"start\":5.85,\"end\":5.95},{\"text\":\"drop.\",\"start\":5.95,\"end\":6.25},{\"text\":\"Just\",\"start\":6.35,\"end\":6.55},{\"text\":\"code\",\"start\":6.55,\"end\":6.8},{\"text\":\"that\",\"start\":6.8,\"end\":6.95},{\"text\":\"becomes\",\"start\":6.95,\"end\":7.3},{\"text\":\"cinema.\",\"start\":7.3,\"end\":7.7,\"key\":true}]"}'
        data-start="0"
        data-duration="8"
        data-track-index="0"
        data-width="1920"
        data-height="1080"
        style="position: absolute; inset: 0; width: 1920px; height: 1080px"
      ></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["caption-word-pop-demo"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
