# Builds the CLI (with our Studio) as an npm tarball and attaches it to a GitHub release.
# promptwise's sandbox image installs it with `npm i -g <release asset url>`.
name: promptwise release

# Push a promptwise-v* tag, or run it by hand with the tag to create on the commit it runs on.
on:
  push:
    tags: ["promptwise-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, e.g. promptwise-v1
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      # Studio checks this at build time; the sandbox sets HYPERFRAMES_NO_TELEMETRY for the CLI.
      - run: bun run build
        env:
          VITE_HYPERFRAMES_NO_TELEMETRY: "1"
      # Upstream publishes the CLI as "hyperframes", so the sandbox's paths stay the same.
      - run: npm pkg set name=hyperframes && npm pack --pack-destination "$RUNNER_TEMP"
        working-directory: packages/cli
      # Studio for promptwise's browser, stamped with this release: the tab checks it against NEXT_PUBLIC_STUDIO_RELEASE.
      - run: npm ci --no-audit --no-fund && node build.mjs && tar -czf "$RUNNER_TEMP/studio-web.tgz" -C dist .
        working-directory: promptwise-web
        env:
          PROMPTWISE_RELEASE: ${{ inputs.tag || github.ref_name }}
      - run: gh release create "$TAG" "$RUNNER_TEMP"/hyperframes-*.tgz "$RUNNER_TEMP/studio-web.tgz" --target "$GITHUB_SHA" --title "$TAG" --notes "HyperFrames CLI with the promptwise Studio, and Studio for the browser (studio-web.tgz)."
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
      # Starts promptwise's Bump sandbox pins workflow (BebraAI/bebraai, .github/workflows/bump.yml), which opens a draft
      # PR there pinning this release in the sandbox image. BEBRAAI_DISPATCH_TOKEN is a fine-grained token with
      # Actions: write on BebraAI/bebraai; without it, run that workflow by hand with this tag.
      - name: Bump promptwise's sandbox
        env:
          GH_TOKEN: ${{ secrets.BEBRAAI_DISPATCH_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "::notice::No BEBRAAI_DISPATCH_TOKEN: run BebraAI/bebraai's Bump sandbox pins workflow with hyperframes=$TAG by hand."; exit 0; fi
          gh workflow run bump.yml -R BebraAI/bebraai --ref main -f hyperframes="$TAG"
