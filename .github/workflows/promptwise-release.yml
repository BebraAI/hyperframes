# Builds the CLI (with our Studio) as an npm tarball and attaches it to a GitHub release.
# promptwise's sandbox image installs it with `npm i -g <release asset url>`.
name: promptwise release

# Push a promptwise-v* tag, or run it by hand with the tag to create on the commit it runs on.
on:
  push:
    tags: ["promptwise-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, e.g. promptwise-v1
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      # Studio checks this at build time; the sandbox sets HYPERFRAMES_NO_TELEMETRY for the CLI.
      - run: bun run build
        env:
          VITE_HYPERFRAMES_NO_TELEMETRY: "1"
      # Upstream publishes the CLI as "hyperframes", so the sandbox's paths stay the same.
      - run: npm pkg set name=hyperframes && npm pack --pack-destination "$RUNNER_TEMP"
        working-directory: packages/cli
      - run: gh release create "$TAG" "$RUNNER_TEMP"/hyperframes-*.tgz --target "$GITHUB_SHA" --title "$TAG" --notes "HyperFrames CLI with the promptwise Studio."
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
