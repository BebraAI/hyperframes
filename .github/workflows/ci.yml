# promptwise CI: the checks for what this fork changes, Studio and the CLI that serves it.
# Upstream's other workflows (renders, Windows, Lambda, catalog, npm publish, perf benches) are removed.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, format and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: ./.github/actions/prepare-ffmpeg-bin
      - run: bash scripts/ci/install-workspace-dependencies.sh
      - run: node_modules/.bin/oxlint packages/studio packages/cli
      - run: node scripts/check-studio-copy-dashes.mjs
      - run: bun run format:check
      - run: bun run build
      - run: bun run --filter '@hyperframes/{studio,cli}' typecheck

  test-studio:
    name: Test (studio)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-test-workspace
      - run: bun run --cwd packages/studio test

  test-cli:
    name: Test (cli)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-test-workspace
      - run: bun run --filter '@hyperframes/cli' test

  studio-smoke:
    name: "Studio: load smoke"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: ./.github/actions/prepare-ffmpeg-bin
      - run: bash scripts/ci/install-workspace-dependencies.sh
      # vite.config.ts is loaded by Node and resolves these workspace packages through their built "node" export.
      - run: bun run --filter '@hyperframes/{parsers,lint,studio-server}' build
      - run: bun run --cwd packages/core build
      - run: bun run --cwd packages/core build:hyperframes-runtime
      - name: Start Studio and check for runtime errors
        run: |
          bun run --filter '@hyperframes/studio' dev -- --port 5199 &
          SERVER_PID=$!
          for i in $(seq 1 40); do
            if curl -sf http://localhost:5199/ >/dev/null 2>&1; then break; fi
            sleep 0.5
          done
          node scripts/studio-runtime-smoke.mjs http://localhost:5199/#project=smoke-test
          kill $SERVER_PID 2>/dev/null || true
